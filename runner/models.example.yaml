# Roster for a real run. ≥ 5 generators, ≥ 3 vendors, ≥ 1 open-weights (spec 6.1).
# The opponent must come from a vendor different from the generators' majority vendor.
# API keys are read from the named environment variables; nothing is stored here.
generators:
  - {name: gpt-4.1,                 provider: openai_compat, vendor: openai,       api_key_env: OPENAI_API_KEY}
  - {name: claude-sonnet-4-5,       provider: anthropic,     vendor: anthropic,    api_key_env: ANTHROPIC_API_KEY}
  - {name: gemini-2.5-pro,          provider: google,        vendor: google,       api_key_env: GOOGLE_API_KEY}
  - {name: mistral-large-latest,    provider: openai_compat, vendor: mistral,      base_url: https://api.mistral.ai/v1, api_key_env: MISTRAL_API_KEY}
  - {name: qwen3:32b,               provider: openai_compat, vendor: open-weights, base_url: http://localhost:11434/v1, api_key_env: LOCAL_API_KEY, open_weights: true}
opponent:
  {name: claude-opus-4-1,           provider: anthropic,     vendor: anthropic,    api_key_env: ANTHROPIC_API_KEY}
judges:
  - {name: gemini-2.5-pro,          provider: google,        vendor: google,       api_key_env: GOOGLE_API_KEY}
  - {name: mistral-large-latest,    provider: openai_compat, vendor: mistral,      base_url: https://api.mistral.ai/v1, api_key_env: MISTRAL_API_KEY}
raters:
  - {name: gpt-4.1,                 provider: openai_compat, vendor: openai,       api_key_env: OPENAI_API_KEY}
  - {name: claude-sonnet-4-5,       provider: anthropic,     vendor: anthropic,    api_key_env: ANTHROPIC_API_KEY}
  - {name: gemini-2.5-pro,          provider: google,        vendor: google,       api_key_env: GOOGLE_API_KEY}
  - {name: qwen3:32b,               provider: openai_compat, vendor: open-weights, base_url: http://localhost:11434/v1, api_key_env: LOCAL_API_KEY, open_weights: true}
