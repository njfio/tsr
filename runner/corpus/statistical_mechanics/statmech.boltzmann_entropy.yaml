id: statmech.boltzmann_entropy
domain: statistical_mechanics
title: "Boltzmann entropy"
statement: "The entropy of a macrostate is Boltzmann's constant times the logarithm of the number of microstates that realize it."
formula: "S = k × ln W"
form: definition
variables:
  - {name: entropy S, quantity: entropy}
  - {name: number of microstates W, quantity: number of microstates}
  - {name: Boltzmann constant k, quantity: Boltzmann constant}
