  - {name: mass m, quantity: mass m}
  - {name: drag coefficient C_d, quantity: drag coefficient}
  - {name: fluid density ρ, quantity: density}
  - {name: cross-section A, quantity: area}
  - {name: gravitational field g, quantity: gravitational field g}
costs:
