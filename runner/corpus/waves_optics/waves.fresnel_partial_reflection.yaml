standard_sources: ["Fresnel 1823; Hecht, Optics, ch. 4"]
book_status: unreflected
review: pending
notes: "'No difference, no reflection' (deep read Pass 5). JUDGMENT under R1 (index contrast inherits the refractive-index joint). R + T = 1 is conservation and keeps on its own."
