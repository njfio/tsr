id: waves.diffraction
domain: waves_optics
title: "Diffraction"
statement: "A wave passing through an aperture spreads; the narrower the aperture compared with the wavelength, the wider the spread."
formula: "sin θ ≈ λ ÷ a"
form: equation
variables:
  - {name: spreading angle θ, quantity: angle}
  - {name: wavelength λ, quantity: wavelength}
  - {name: aperture width a, quantity: aperture width, carries_distance: true}
costs:
