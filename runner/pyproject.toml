[project]
name = "tsr-runner"
version = "0.1.0"
description = "TSR Rule Runner: run the one rule through unreflected physics with the joints closed, and detect collisions between forced rows."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tsr-runner = "tsr_runner.cli:main"

[tool.setuptools]
packages = ["tsr_runner"]
